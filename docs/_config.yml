# Site settings
title: Fried Notes
description: Practical guides, release notes, and API references.
# The Pages workflow supplies `baseurl` at build time so links work on both
# the GitHub project URL and a custom domain.
url: ""
baseurl: ""
lang: en

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-last-modified-at

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: docs

exclude:
  - readme.md
